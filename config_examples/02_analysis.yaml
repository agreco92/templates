# ========================================================================
# Clustering Benchmark
# ========================================================================
# Evaluates clustering quality using metrics from OSCA Advanced Chapter 5
# (bluster/scran). Computes silhouette widths, neighbor purity, RMSD,
# graph modularity. Optionally compares multiple clusterings, runs
# bootstrap stability, or sweeps parameters.

05_benchmark_clustering:
  # Input: Seurat object with clustering results and a dim reduction
  input_path: "data/01_preprocessing/02_merge_samples/merged.rds"

  # Output directories
  dir_output: "{projectDir}/data/02_analysis/05_benchmark_clustering/"
  dir_figures: "{projectDir}/figures/02_analysis/05_benchmark_clustering/"

  # --- Which clusterings to evaluate ---
  # Single column or list of columns from metadata
  cluster_columns:
    - "seurat_clusters"
  # - "RNA_snn_res.0.3"    # uncomment to compare multiple resolutions
  # - "RNA_snn_res.1"

  # --- Dimensionality reduction for distance-based metrics ---
  # Use the reduction that clustering was based on (pca, harmony, integrated.rpca, etc.)
  reduction: "pca"
  dims: 30                    # number of dims from the reduction to use

  # --- UMAP for diagnostic overlay plots ---
  umap_reduction: "umap"      # set to null to skip UMAP plots

  # --- Metric parameters ---
  purity_k: 50                # k neighbors for purity (higher = smoother, less sensitive)

  # --- Graph modularity ---
  # Measures edge density within vs between clusters
  modularity: true            # set false to skip
  graph_name: null            # auto-detect SNN graph; or specify e.g. "RNA_snn"
  rebuild_graph: false        # true = build fresh SNN from reduction (ignores stored graph)
  snn_k: 20                  # k for SNN construction (only if rebuild_graph: true)
  snn_type: "jaccard"         # "jaccard" or "rank" (only if rebuild_graph: true)

  # --- Parameter sweep (off by default) ---
  # Systematically varies k and clustering algorithm, computes silhouette for each
  sweep:
    enabled: false
    k_values: [5, 10, 15, 20, 25, 30, 35, 40]
    cluster_fun:
      - "louvain"
      - "walktrap"


