# ========================================================================
# Differential Expression Analysis
# ========================================================================

02_celltype_DEG_edgeR:
  # Input path to annotated Seurat object with cell type annotations
  input_path: "data/02_analysis/01_cellcycle_analysis/cc_annotated.rds"
  
  # Output directories (use glue syntax with projectDir)
  dir_output: "{projectDir}/data/02_analysis/02_celltype_DGE/"
  dir_figures: "{projectDir}/figures/02_analysis/02_celltype_DGE/"
  
  # Metadata column names
  sample_column: "sample_id"           # Column identifying biological replicates
  condition_column: "condition"        # Column with treatment conditions
  celltype_column: "cell_type"         # Column with cell type annotations
  
  # Condition labels (for setting reference level in DE comparison)
  control_condition: "control"         # Reference condition name
  case_condition: "treatment"          # Treatment condition name
  
  # Pseudobulk parameters
  min_cells: 10  # Minimum cells per celltype per sample (filters low-quality pseudobulk)
  
  # DE thresholds for significance calling
  de_thresholds:
    fdr: 0.05      # False discovery rate threshold
    logfc: 1       # Log2 fold-change threshold (absolute value)
  
  # Volcano plot visualization settings
  volcano:
    top_genes_label: 10  # Number of top DEGs to label on volcano plot


# ========================================================================
# Cell Cycle Analysis
# ========================================================================

03_cellcycle_analysis:
  # Input path to Seurat object
  input_path: "data/01_preprocessing_liu_skin/02_merge_samples_imq_only/merged.rds"
  # Output directories
  dir_output: "{projectDir}/data/01_preprocessing_liu_skin/03_cellcycle_analysis/"
  dir_figures: "{projectDir}/figures/01_preprocessing_liu_skin/03_cellcycle_analysis/"
  
  # Metadata column names (set to null if not present in dataset)
  # group_column: "lca_celltype"      # Column to group cells by (e.g., celltype, cluster)
  sample_column: "sample_id"        # Column identifying biological samples (null if single sample)
  condition_column: "condition"     # Column with experimental conditions (null if no conditions)
  # control_condition: "VAS"          # Control condition for filtering trend plot (null to use all)
  
  # Cell cycle gene paths (null = use default location)
  g2m_genes_path: null
  s_genes_path: null
  
  # Tricycle thresholds for G1 classification
  # Cells with tricycle_position < g1_lower OR > g1_upper are classified as G1
  tricycle_thresholds:
    g1_lower: 0.6
    g1_upper: 5.2
  
  # Filtering thresholds
  min_cells_trend: 500      # Min cells per group for trend plot


# ========================================================================
# sciRED Factor Analysis (Python)
# ========================================================================
# Runs sciRED (Single-Cell Interpretable REsidual Decomposition) to identify
# factor-covariate associations. Requires conda env with sciRED installed.
#
# Pipeline: raw counts → Poisson GLM → Pearson residuals → PCA → varimax →
#           FCA heatmap + FIS table
#
# NOTE: sciRED expects RAW COUNTS (not log-normalized). The Poisson GLM with
# library size as covariate IS the normalization step.
# NOTE: Do NOT regress out batch in the GLM — include it as a covariate for
# FCA interpretation instead. The paper recommends merging without batch
# correction and letting sciRED identify batch-associated factors.

04_sciRED_factor_analysis:
  # Input: path to .h5ad file with raw counts in adata.X
  input_path: "{projectDir}/data/02_analysis/anndata_counts.h5ad"

  # Output directories
  dir_output: "{projectDir}/data/02_analysis/04_sciRED_factor_analysis/"
  dir_figures: "{projectDir}/figures/02_analysis/04_sciRED_factor_analysis/"

  # --- Factor discovery parameters ---
  n_components: 30          # Number of factors (PCA components before rotation)
  n_genes: 2000             # Top variable genes for analysis

  # --- GLM covariates ---
  # lib_size_col: library size column in adata.obs (used by Poisson GLM)
  lib_size_col: "nCount_RNA"
  # technical_covariates: additional covariates to regress out in GLM
  #   - null: only library size (recommended default)
  #   - list of adata.obs column names to include as one-hot encoded covariates
  #   - WARNING: regressing out sample/batch can remove biological signal
  technical_covariates: null

  # --- Biological covariates for FCA ---
  # These are NOT regressed out — they are used to interpret factors
  covariates:
    - age
    - sex
    - genotype
    - batch

  # --- FCA classifier settings ---
  fca_scale: "standard"     # scaling: "standard", "minmax", or "rank"
  fca_mean: "arithmatic"    # mean type: "arithmatic" or "geometric" (sic, sciRED typo)
  fca_time_eff: true        # skip RandomForest (slower, marginal improvement)

  # --- Output settings ---
  n_top_genes: 30           # top genes per factor to report
  seed: 10


# Example: project-specific overrides
# Uncomment and adapt for your project's YAML (not the template example)
