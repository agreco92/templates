# Configuration for 02_analysis module
# Reference mapping and downstream analysis

00_map_to_reference:
  # Input paths
  # reference_path: path to reference Seurat object (must have reductions for mapping)
  reference_path: "path/to/reference.rds"
  
  # query_path: path to query Seurat object to map
  query_path: "data/01_preprocessing/02_merge_samples/merged.rds"
  
  # Output directories (use glue syntax with projectDir)
  dir_output: "{projectDir}/data/02_analysis/00_map_to_reference/"
  dir_figures: "{projectDir}/figures/02_analysis/00_map_to_reference/"
  
  # Assay and batch settings
  assay_use: "RNA"
  batch_column: null  # set to column name (e.g., "sample_id") to split layers before mapping
  
  # Metadata columns
  sample_column: "sample_id"
  
  # Anchor finding settings
  ref_anchors:
    dr: "pca"          # REQUIRED: reduction in reference for anchor finding
    n_dims: 20         # number of dimensions to use (default: 20)
  
  # UMAP settings for reference (three modes, in priority order):
  #   1. precomputed: use existing UMAP reduction in reference (no recomputation)
  #   2. precomputed_nn: compute UMAP from pre-computed NN graph (e.g., WNN)
  #   3. dr: compute UMAP from a dimensionality reduction
  ref_umap:
    precomputed: null       # name of existing UMAP reduction (e.g., "umap")
    precomputed_nn: null    # NN graph name for WNN-based UMAP (e.g., "weighted.nn")
    dr: "pca"               # reduction to compute UMAP from (e.g., "pca", "integrated.rpca")
    n_dims: 20              # dims for UMAP computation (default: same as ref_anchors$n_dims)
    name: "umap"            # name for output UMAP reduction (default: "umap")
    densmap: false          # use densMAP for visualization (default: false)
  
  # refdata: REQUIRED - defines what to transfer from reference to query
  # Keys become prediction column names, values are reference metadata columns
  refdata:
    celltype: "cell_type"       # creates predicted.celltype -> ref_celltype
    celltype2: "cell_type2"     # creates predicted.celltype2 -> ref_celltype2
    # predicted_ADT: "ADT"      # uncomment to transfer ADT predictions
  
  # output_prefix: prefix for renamed prediction columns (default: "ref")
  output_prefix: "ref"


